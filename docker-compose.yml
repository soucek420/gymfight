version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: gymfight-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: gymfight
    volumes:
      - mongodb_data:/data/db
    networks:
      - gymfight-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gymfight-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/gymfight
      - JWT_SECRET=${JWT_SECRET:-37f07fb654721b30a44704c29ede46c9ce77d3eadf86a6f88fbce2f418614ace}
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - gymfight-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gymfight-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - gymfight-network

volumes:
  mongodb_data:
    driver: local

networks:
  gymfight-network:
    driver: bridge
